name: CI - Security Governance & Guardrails Engine

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-validate:
    name: Lint, Test & Validate Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint Code with Ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Execute Pytest Suite with Moto Mocks
        run: |
          pytest -v --cov=src --cov-report=term-missing

      - name: Lint AWS Organizations Service Control Policies
        run: |
          python -m src.cli lint-scp

      - name: Execute Full Governance Simulation
        run: |
          python -m src.cli simulate

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Terraform Format Check
        run: |
          terraform -chdir=terraform fmt -check

      - name: Terraform Init & Validate
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate
